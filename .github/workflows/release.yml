# Pushing a tag such as v0.1.0 tests the code at that tag, publishes the app and attaches to a GitHub Release the
# installer and a .zip, each with its SHA-256.
#
# Both are framework-dependent: they need the .NET Desktop Runtime 10, which the installer checks for. The
# experimental AnimatedHost is left out, since the app does not start it yet. Neither is signed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The tag reaches the script through the environment, never pasted into it.
      - name: Read the version from the tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "The tag '$env:TAG' is not a version such as v0.1.0 or v0.2.0-beta.1."
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      # Nothing is released from a commit whose tests fail.
      - name: Test
        run: dotnet test WallpaperEditor.slnx --configuration Release

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish src/WallpaperEditor.App/WallpaperEditor.App.csproj
          --configuration Release --runtime win-x64 --self-contained false
          -p:Version=$env:VERSION
          --output artifacts/WallpaperEditor

      # Inno Setup comes with the Windows runner images; installed from Chocolatey if an image ever drops it.
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          $numeric = $env:VERSION -replace '-.*$', ''
          & $iscc "/DAppVersion=$env:VERSION" "/DNumericVersion=$numeric" `
            "/DPublishDir=$PWD\artifacts\WallpaperEditor" "/DOutputDir=$PWD\artifacts" installer\WallpaperEditor.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with code $LASTEXITCODE." }

      - name: Package
        shell: pwsh
        run: |
          $zip = "artifacts/WallpaperEditor-$env:VERSION-win-x64.zip"
          Compress-Archive -Path artifacts/WallpaperEditor/* -DestinationPath $zip
          $setup = "artifacts/WallpaperEditor-$env:VERSION-setup.exe"
          foreach ($file in $zip, $setup) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)" | Set-Content "$file.sha256" -Encoding ascii
          }
          "ZIP=$zip" >> $env:GITHUB_ENV
          "SETUP=$setup" >> $env:GITHUB_ENV

      # A version with a suffix, such as -beta.1, is marked as a pre-release.
      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $flags = @('--generate-notes', '--title', "WallpaperEditor $env:VERSION")
          if ($env:VERSION -match '-') { $flags += '--prerelease' }
          gh release create $env:TAG $env:SETUP "$env:SETUP.sha256" $env:ZIP "$env:ZIP.sha256" @flags
